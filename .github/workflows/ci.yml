name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: php -l on every shipped and test PHP file
        run: git ls-files '*.php' | xargs -n1 -P4 php -l > /dev/null

  standards:
    name: WPCS + PHPCompatibility + secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: WordPress Coding Standards (includes PHPCompatibilityWP, testVersion 7.4-)
        run: vendor/bin/phpcs
      - name: Secret scan of tracked files
        run: bin/scan-secrets.sh

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit -c phpunit-unit.xml.dist

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', wp: '6.5.13', db: 'mariadb:10.11', label: '', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { php: '8.1', wp: '6.9.10', db: 'mariadb:10.11', label: '', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { php: '8.3', wp: '7.1.3', db: 'mariadb:10.11', label: '', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { php: '8.4', wp: '7.1.3', db: 'mariadb:10.11', label: '', health: 'healthcheck.sh --connect --innodb_initialized' }
          # The production server: VECTOR is a keyword since MariaDB 11.7 (beta.3 could not create
          # the embeddings table there). SchemaCompatibilityTest covers it.
          - { php: '8.3', wp: '7.1.3', db: 'mariadb:11.8', label: ', MariaDB 11.8', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { php: '8.3', wp: '7.1.3', db: 'mysql:8.4', label: ', MySQL 8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot' }
    services:
      mysql:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_tests
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
        ports: [ '3306:3306' ]
        options: --health-cmd="${{ matrix.health }}" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      WP_TESTS_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mysqli, zip
          tools: composer:v2
          coverage: none
      - name: WordPress ${{ matrix.wp }} release + test library
        run: bin/install-wp-tests.sh ${{ matrix.wp }} "$RUNNER_TEMP/wp" | sed 's/^export //' >> "$GITHUB_ENV"
      - run: composer install --no-interaction --no-progress
      - name: Nguyen Ha VI-EN Core (the blog's language plugin, pinned, read-only) for NhVienLanguageTest
        run: |
          git init -q "$RUNNER_TEMP/wordpress-theme"
          git -C "$RUNNER_TEMP/wordpress-theme" fetch -q --depth 1 https://github.com/thuexemayhanoi/wordpress-theme.git d8f6b582a97d03071bae7019bfeead20bfde267d
          git -C "$RUNNER_TEMP/wordpress-theme" checkout -q FETCH_HEAD
          echo "NH_VIEN_PLUGIN_DIR=$RUNNER_TEMP/wordpress-theme/plugins/nguyen-ha-vi-en" >> "$GITHUB_ENV"
      - name: Database server
        run: mysql -h127.0.0.1 -uroot -proot -e "SELECT VERSION()"
      - name: Integration suite (real WordPress + ${{ matrix.db }})
        run: vendor/bin/phpunit -c phpunit.xml.dist

  js:
    name: JS unit + Chromium worker fixture test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:js
      - run: npm run test:js
      - name: Bundle the browser runtime
        run: node bin/build-vendor.mjs
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Worker pipeline vs NumPy reference (tiny TEST FIXTURE model, not Qwen)
        run: node tests/e2e/worker-fixture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-fixture-results
          path: tests/e2e/artifacts/

  package:
    name: Build release ZIP + install smoke test
    needs: [ standards, unit, integration, js ]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: [ '3306:3306' ]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, zip
          tools: wp-cli
          coverage: none
      - run: npm ci --ignore-scripts
      - run: node bin/build-vendor.mjs
      - name: Build ZIP
        run: bin/build-zip.sh
      - name: Reproducible build (a second build of this commit has the same SHA-256)
        run: |
          DIST_DIR="$RUNNER_TEMP/zip2" BUILD_DIR="$RUNNER_TEMP/build2" bin/build-zip.sh
          cmp dist/semantic-seo-engine-vi-en-*.zip "$RUNNER_TEMP"/zip2/semantic-seo-engine-vi-en-*.zip
          echo "identical: $(cut -d' ' -f1 dist/*.sha256)"
      - name: Licenses of the bundled libraries are shipped
        run: |
          for f in LICENSE assets/vendor/transformers/LICENSE-transformers.js.txt assets/vendor/transformers/LICENSE-onnxruntime-web.txt assets/vendor/transformers/THIRD-PARTY-NOTICES.txt; do
            unzip -Z1 dist/semantic-seo-engine-vi-en-*.zip | grep -qx "semantic-seo-engine-vi-en/$f" || { echo "missing $f"; exit 1; }
          done
      - name: Grant the test user database creation rights
        run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'wp'@'%'; FLUSH PRIVILEGES;"
      - name: Install/activate/deactivate/uninstall smoke test from the ZIP (WordPress 6.5.13 and 7.1.3)
        run: |
          for v in 6.5.13 7.1.3; do
            mkdir -p "$RUNNER_TEMP/wp-src-$v"
            curl -fsSL "https://wordpress.org/wordpress-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP/wp-src-$v" --strip-components=1
            WP_SOURCE="$RUNNER_TEMP/wp-src-$v" SITES_DIR="$RUNNER_TEMP/sites" tests/e2e/smoke-zip.sh "$v" 8080
          done
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-seo-engine-vi-en-zip
          path: |
            dist/*.zip
            dist/*.sha256
            tests/e2e/artifacts/

  compat:
    name: Coexistence with WooCommerce, Yoast SEO and Polylang (WP 7.1.3)
    needs: [ package ]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: [ '3306:3306' ]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, zip
          tools: wp-cli
          coverage: none
      - run: npm ci --ignore-scripts && node bin/build-vendor.mjs && bin/build-zip.sh
      - name: Grant the test user database creation rights
        run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'wp'@'%'; FLUSH PRIVILEGES;"
      - name: Install next to WooCommerce, Yoast SEO and Polylang; front end unchanged; analysis; deactivation
        run: |
          mkdir -p "$RUNNER_TEMP/wp-src"
          curl -fsSL "https://wordpress.org/wordpress-7.1.3.tar.gz" | tar -xz -C "$RUNNER_TEMP/wp-src" --strip-components=1
          WP_SOURCE="$RUNNER_TEMP/wp-src" SITES_DIR="$RUNNER_TEMP/sites" tests/e2e/compat-plugins.sh 7.1.3 8090
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-plugins
          path: tests/e2e/artifacts/compat-plugins.json
