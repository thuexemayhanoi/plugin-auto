name: Release

# Publishes the installable WordPress ZIP (not the GitHub source archive) when a version tag such as
# v1.0.0-beta.4 is pushed: builds it twice to prove the build is reproducible, runs the install
# smoke test, and attaches the ZIP and its SHA-256 to a GitHub Release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish the plugin ZIP
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
        ports: [ '3306:3306' ]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, zip
          tools: wp-cli
          coverage: none
      - name: Tag matches the plugin version
        run: |
          V="$(sed -n 's/^ \* Version:[[:space:]]*//p' semantic-seo-engine-vi-en.php | head -1 | tr -d '\r')"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts && node bin/build-vendor.mjs
      - name: Build ZIP twice (reproducible)
        run: |
          bin/build-zip.sh
          DIST_DIR="$RUNNER_TEMP/zip2" BUILD_DIR="$RUNNER_TEMP/build2" bin/build-zip.sh
          cmp dist/semantic-seo-engine-vi-en-$VERSION.zip "$RUNNER_TEMP"/zip2/semantic-seo-engine-vi-en-$VERSION.zip
      - name: Install smoke test from the ZIP (WordPress 7.1.3, MariaDB 11.8)
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'wp'@'%'; FLUSH PRIVILEGES;"
          mkdir -p "$RUNNER_TEMP/wp-src"
          curl -fsSL "https://wordpress.org/wordpress-7.1.3.tar.gz" | tar -xz -C "$RUNNER_TEMP/wp-src" --strip-components=1
          WP_SOURCE="$RUNNER_TEMP/wp-src" SITES_DIR="$RUNNER_TEMP/sites" tests/e2e/smoke-zip.sh 7.1.3 8080
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Installable WordPress plugin ZIP: Plugins → Add New → Upload Plugin → semantic-seo-engine-vi-en-$VERSION.zip."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 dist/semantic-seo-engine-vi-en-$VERSION.zip.sha256)\` (reproducible build; install smoke test passed on WordPress 7.1.3 + MariaDB 11.8)."
            echo
            echo "BETA: read-only by default. Try it on a staging copy with a database backup first. Changes: see CHANGELOG.md."
          } > "$NOTES"
          gh release create "$GITHUB_REF_NAME" dist/semantic-seo-engine-vi-en-$VERSION.zip dist/semantic-seo-engine-vi-en-$VERSION.zip.sha256 \
            --title "Semantic SEO Engine VI–EN $VERSION" --notes-file "$NOTES" --prerelease
