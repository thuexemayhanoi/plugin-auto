name: Read-only site census + pilot (blog.rentbikehanoi.com)

# READ-ONLY. Public GET requests only (robots.txt, XML sitemaps, public REST collections), slow and
# sequential. Nothing is written to the site. The pilot analyses a DISPOSABLE copy of the public
# content on the runner and publishes AGGREGATE numbers only (no titles, URLs or per-page findings:
# logs and artifacts of a public repository are public). The copy is discarded with the runner.
on:
  workflow_dispatch:
    inputs:
      embed:
        description: 'Also embed the copy with the real Qwen3-Embedding-0.6B (q4f16, the default precision) through the private worker'
        type: boolean
        default: true
  push:
    paths:
      - 'tests/site/**'
      - '.github/workflows/site-census.yml'

permissions:
  contents: read

concurrency:
  group: site-census
  cancel-in-progress: false

env:
  SITE: https://blog.rentbikehanoi.com

jobs:
  census:
    name: Census (sitemaps + REST totals) and read-only pilot on a disposable copy
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: [ '3306:3306' ]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: URL census from the site's own sitemaps and REST totals (GET only)
        run: python -I tests/site/census.py --site "$SITE" --out tests/e2e/artifacts/site-census.json

      - name: Export the public content and the hreflang of English pages (GET only; stays on the runner, never uploaded)
        run: python -I tests/site/export_public.py --site "$SITE" --out "$RUNNER_TEMP/site.json" --hreflang

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, zip
          tools: composer:v2, wp-cli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts && node bin/build-vendor.mjs
      - name: Build ZIP
        run: bin/build-zip.sh
      - name: Grant the test user database creation rights
        run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'wp'@'%'; FLUSH PRIVILEGES;"
      - name: Disposable WordPress 7.1.3 + Yoast SEO + the site's VI-EN plugin (pinned) + this plugin
        run: |
          mkdir -p "$RUNNER_TEMP/wp-src"
          curl -fsSL "https://wordpress.org/wordpress-7.1.3.tar.gz" | tar -xz -C "$RUNNER_TEMP/wp-src" --strip-components=1
          WP_SOURCE="$RUNNER_TEMP/wp-src" tests/e2e/setup-site.sh 7.1.3 8080 "$RUNNER_TEMP/pilot"
          WP="wp --allow-root --path=$RUNNER_TEMP/pilot"
          $WP plugin install wordpress-seo --activate
          git init -q "$RUNNER_TEMP/wordpress-theme"
          git -C "$RUNNER_TEMP/wordpress-theme" fetch -q --depth 1 https://github.com/thuexemayhanoi/wordpress-theme.git d8f6b582a97d03071bae7019bfeead20bfde267d
          git -C "$RUNNER_TEMP/wordpress-theme" checkout -q FETCH_HEAD
          cp -R "$RUNNER_TEMP/wordpress-theme/plugins/nguyen-ha-vi-en" "$RUNNER_TEMP/pilot/wp-content/plugins/"
          $WP plugin activate nguyen-ha-vi-en
          $WP plugin install dist/semantic-seo-engine-vi-en-*.zip --activate
          $WP eval '\SemanticSEO\Settings::update( array( "default_locale" => "vi" ) );'
          $WP plugin list --fields=name,status,version
      - name: Import the copy (links rewritten to the copy; English = published below /en/)
        run: mkdir -p tests/e2e/artifacts && SSEO_SITE_EXPORT="$RUNNER_TEMP/site.json" wp --allow-root --path="$RUNNER_TEMP/pilot" eval-file tests/site/import-public.php
      - name: Inventory + analysis (lexical tier), timed
        run: |
          WP="wp --allow-root --path=$RUNNER_TEMP/pilot"
          START=$(date +%s)
          $WP sseo start inventory --then-analyze --run --user=admin > /dev/null
          echo "inventory + lexical analysis seconds: $(( $(date +%s) - START ))"
          $WP eval-file tests/site/pilot-report.php | tee tests/e2e/artifacts/site-pilot-lexical.json

      - name: Fetch + verify the pinned q4f16 model files
        if: github.event_name == 'push' || inputs.embed
        run: |
          python -m pip install --quiet -r tools/private-worker/requirements.txt
          python -I tests/real-model/fetch_verify.py --cache-dir "$HOME/.cache/sseo-worker" --dtypes q4f16 --manifest "$RUNNER_TEMP/manifest.json"
      - name: Embed the copy with the real model through the private worker (REST + Application Password), re-analyse
        if: github.event_name == 'push' || inputs.embed
        run: |
          WP="wp --allow-root --path=$RUNNER_TEMP/pilot"
          $WP eval '\SemanticSEO\Settings::update( array( "model_dtype" => "q4f16" ) ); \SemanticSEO\Capabilities::ensure_agent_roles();'
          $WP user create pilot_worker pilot_worker@example.test --role=sseo_worker --user_pass="$(head -c 18 /dev/urandom | base64)" > /dev/null
          APP="$($WP user application-password create pilot_worker pilot --porcelain)"
          $WP sseo start embed --user=admin
          for _ in $(seq 1 60); do $WP eval '\SemanticSEO\Jobs\JobRunner::tick( 15 );' > /dev/null; done
          START=$(date +%s)
          SSEO_APP_PASSWORD="$APP" python -I tools/private-worker/sseo_worker.py --site http://127.0.0.1:8080 --user pilot_worker --allow-http --once --batch 16 --threads 4 --cache-dir "$HOME/.cache/sseo-worker" --quiet
          echo "embedding seconds: $(( $(date +%s) - START ))"
          for _ in 1 2 3; do $WP eval '\SemanticSEO\Jobs\JobRunner::tick( 15 );' > /dev/null; done
          # Comparison: overlap gate with the model's fixed calibration floor only (site baseline off).
          mkdir -p "$RUNNER_TEMP/pilot/wp-content/mu-plugins"
          echo '<?php add_filter( "sseo_similarity_baseline_enabled", "__return_false" );' > "$RUNNER_TEMP/pilot/wp-content/mu-plugins/pilot-model-floor.php"
          START=$(date +%s)
          $WP sseo start analyze --run --user=admin > /dev/null
          echo "hybrid re-analysis (model floor only) seconds: $(( $(date +%s) - START ))"
          $WP eval-file tests/site/pilot-report.php | tee tests/e2e/artifacts/site-pilot-hybrid-model-floor.json
          rm "$RUNNER_TEMP/pilot/wp-content/mu-plugins/pilot-model-floor.php"
          # Default: floor raised to the site's median similarity per language.
          START=$(date +%s)
          $WP sseo start analyze --run --user=admin > /dev/null
          echo "hybrid re-analysis seconds: $(( $(date +%s) - START ))"
          $WP eval-file tests/site/pilot-report.php | tee tests/e2e/artifacts/site-pilot-hybrid.json
      - name: Front end of the copy unchanged by the plugin (no plugin assets, no model requests)
        run: |
          curl -fsS http://127.0.0.1:8080/ -o "$RUNNER_TEMP/home.html"
          if grep -qE "semantic-seo-engine-vi-en/(assets|admin)|transformers|onnx" "$RUNNER_TEMP/home.html"; then
            echo "plugin assets or model runtime found on the front page"; exit 1
          fi
          echo "front page has no plugin assets or model runtime"
      - name: Summary (aggregates only)
        if: always()
        run: |
          for f in tests/e2e/artifacts/site-census.json tests/e2e/artifacts/site-pilot-lexical.json tests/e2e/artifacts/site-pilot-hybrid-model-floor.json tests/e2e/artifacts/site-pilot-hybrid.json; do
            [ -f "$f" ] && { echo "== $f"; python -c "import json,sys; d=json.load(open(sys.argv[1])); d.pop('sitemaps', None); print(json.dumps(d, separators=(',', ':')))" "$f"; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-census-aggregates
          path: |
            tests/e2e/artifacts/site-census.json
            tests/e2e/artifacts/site-pilot-*.json
