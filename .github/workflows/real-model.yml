name: Real Qwen3-Embedding-0.6B

# Runs the REAL pinned model (the build sandbox cannot reach huggingface.co; GitHub runners can):
# pinned files cross-checked against the Hub metadata and SHA-256 verified, Python ONNX Runtime
# checks per dtype, the browser worker in Chromium downloading from huggingface.co itself, the
# hybrid evaluation through the plugin's own queue, and the private worker over REST.
on:
  workflow_dispatch:
  push:
    paths:
      - 'includes/**'
      - 'assets/js/ai-worker/**'
      - 'tools/private-worker/**'
      - 'tests/real-model/**'
      - 'tests/fixtures/corpus.php'
      - 'tests/php/Integration/HybridEvaluationTest.php'
      - 'tests/php/Integration/RelevanceMetrics.php'
      - 'tests/e2e/private-worker.sh'
      - 'bin/build-vendor.mjs'
      - 'package-lock.json'
      - '.github/workflows/real-model.yml'
  pull_request:
    paths:
      - 'includes/**'
      - 'assets/js/ai-worker/**'
      - 'tools/private-worker/**'
      - 'tests/real-model/**'
      - '.github/workflows/real-model.yml'

permissions:
  contents: read

concurrency:
  group: real-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model:
    name: Real model — pinned download, Python + Chromium inference, hybrid evaluation, private worker
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp_tests
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: [ '3306:3306' ]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_TESTS_DB_HOST: 127.0.0.1
      MODEL_CACHE: /home/runner/.cache/sseo-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python runtime (numpy, onnxruntime, tokenizers)
        run: |
          python -m pip install --quiet -r tools/private-worker/requirements.txt
          python -m pip freeze | grep -iE '^(numpy|onnxruntime|tokenizers)=='
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, zip
          tools: composer:v2, wp-cli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bundle the browser runtime
        run: node bin/build-vendor.mjs
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Restore verified model files
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODEL_CACHE }}
          key: qwen3-embedding-0.6b-onnx-${{ hashFiles('includes/Semantic/ModelProfile.php') }}-q8-q4f16-fp32
      - name: Fetch + verify the pinned files (Hub metadata cross-check, SHA-256)
        run: python -I tests/real-model/fetch_verify.py --cache-dir "$MODEL_CACHE" --dtypes q8,q4f16,fp32 --manifest "$RUNNER_TEMP/manifest.json"
      - name: Save verified model files
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MODEL_CACHE }}
          key: qwen3-embedding-0.6b-onnx-${{ hashFiles('includes/Semantic/ModelProfile.php') }}-q8-q4f16-fp32

      - name: Python ONNX Runtime — model-card self-test per dtype, dtype agreement, cross-language
        run: python -I tests/real-model/verify_model.py --manifest "$RUNNER_TEMP/manifest.json"
      - name: Browser worker in Chromium — downloads from huggingface.co, self-test, vectors vs Python
        run: node tests/real-model/browser-real.mjs tests/e2e/artifacts/real-model-vectors.json

      - name: WordPress 7.1.3 release + test library
        run: bin/install-wp-tests.sh 7.1.3 "$RUNNER_TEMP/wp" | sed 's/^export //' >> "$GITHUB_ENV"
      - run: composer install --no-interaction --no-progress
      - name: Hybrid evaluation (lexical + real vectors through the plugin queue), weight grid
        env:
          SSEO_EMBED_DTYPE: q8
        run: SSEO_EMBED_CMD="python -I tests/real-model/embed_items.py --manifest $RUNNER_TEMP/manifest.json" vendor/bin/phpunit -c phpunit.xml.dist --group real-model

      - name: Build ZIP
        run: bin/build-zip.sh
      - name: Grant the test user database creation rights
        run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'wp'@'%'; FLUSH PRIVILEGES;"
      - name: Private worker over REST (Application Password) with the real model on a disposable site
        run: |
          mkdir -p "$RUNNER_TEMP/wp-src-7.1.3"
          curl -fsSL "https://wordpress.org/wordpress-7.1.3.tar.gz" | tar -xz -C "$RUNNER_TEMP/wp-src-7.1.3" --strip-components=1
          WP_SOURCE="$RUNNER_TEMP/wp-src-7.1.3" SITES_DIR="$RUNNER_TEMP/sites" REAL_MODEL_MANIFEST="$RUNNER_TEMP/manifest.json" REAL_DTYPE=q8 \
            tests/e2e/private-worker.sh 7.1.3 8080 8081 "$(command -v python)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-evidence
          path: |
            tests/e2e/artifacts/
            ${{ runner.temp }}/manifest.json
